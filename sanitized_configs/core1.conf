version 20230616.051920_builder.r1345402;
system {
    root-authentication {
    }
    services {
        ssh {
            root-login allow;
        }
        netconf {
            ssh;
        }
    }
}
interfaces {
    eth1 {
        unit 0 {
            family inet {
                address 10.0.0.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.255.1/32;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface eth1 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
