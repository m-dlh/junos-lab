name: junos-lab

topology:
  nodes:
    core1:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/core1.conf

    core2:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/core2.conf

    core3:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/core3.conf

    s2-core1:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/s2-core1.conf

    s2-core2:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/s2-core2.conf

    s2-core3:
      kind: juniper_crpd
      image: crpd:23.2R1.13
      startup-config: configs/s2-core3.conf

  links:

    - endpoints:
        - "core1:eth1"
        - "core2:eth1"

    - endpoints:
        - "core1:eth2"
        - "core3:eth1"

    - endpoints:
        - "core2:eth2"
        - "core3:eth2"

    - endpoints:
        - "core1:eth3"
        - "s2-core1:eth1"

    - endpoints:
        - "s2-core1:eth2"
        - "s2-core2:eth1"

    - endpoints:
        - "s2-core1:eth3"
        - "s2-core3:eth1"

    - endpoints:
        - "s2-core2:eth2"
        - "s2-core3:eth2"
